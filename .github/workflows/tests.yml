name: tests

# Dibuat hemat menit karena repo private memakai kuota gratis GitHub Actions:
# - hanya jalan di pull request (bukan lagi di setiap push ke main);
# - dilewati jika perubahan hanya dokumentasi;
# - run lama dibatalkan ketika ada push baru ke PR yang sama;
# - matrix hanya versi PHP terendah dan tertinggi yang diuji untuk Laravel 13;
# - dependency Composer di-cache.
# Pre-push hook tetap menjadi pemeriksaan pertama di lokal.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit
